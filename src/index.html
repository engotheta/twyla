<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Studio</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
    <!-- Dark before the first paint, so a dark-theme visit doesn't open on a white page. The
         settings service takes over once the app starts. Keep the key and the default theme
         ('system') in step with provideSettings() in app.config.ts. Under a strict content
         security policy, allow this script by hash or move it to a file. -->
    <script>
      try {
        var theme = (JSON.parse(localStorage.getItem('studio.settings')) || {}).theme;
        var systemDark = matchMedia('(prefers-color-scheme: dark)').matches;
        if (theme === 'dark' || (theme !== 'light' && systemDark)) {
          document.documentElement.classList.add('dark');
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
