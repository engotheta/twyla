<h2 mat-dialog-title>{{ t().export.title(data.format.toUpperCase()) }}</h2>

<div mat-dialog-content>
  <div class="flex items-center justify-end gap-2 mb-2">
    <button type="button" mat-button (click)="selectAll()">
      {{ t().export.selectAll }}
    </button>
    <button type="button" mat-button (click)="selectNone()">
      {{ t().export.selectNone }}
    </button>
  </div>

  <div
    class="w-96 max-h-96 overflow-y-auto"
    role="group"
    [attr.aria-label]="t().export.panel"
    cdkDropList
    [cdkDropListData]="entries()"
    (cdkDropListDropped)="drop($event)"
  >
    @for (entry of entries(); track entry.key) {
      <div
        cdkDrag
        [cdkDragData]="entry"
        class="flex items-center gap-1 rounded px-1 py-1 hover:bg-black/5"
      >
        <div
          *cdkDragPlaceholder
          class="h-9 rounded border-2 border-dashed border-black/20 bg-black/5"
        ></div>
        <div
          *cdkDragPreview
          class="flex items-center gap-2 rounded border border-black/10 bg-white px-2 py-1 text-sm shadow-lg"
        >
          <mat-icon class="!size-6 !text-base opacity-60">drag_indicator</mat-icon>
          <span>{{ entry.label }}</span>
        </div>

        <button
          type="button"
          cdkDragHandle
          mat-icon-button
          class="!w-7 !h-7 cursor-grab"
          [attr.aria-label]="t().columns.dragToReorder(entry.label)"
        >
          <mat-icon class="!size-6 !text-base opacity-60">drag_indicator</mat-icon>
        </button>

        <mat-checkbox [checked]="entry.selected" (change)="toggle(entry)" class="flex-1 min-w-0">
          <span class="truncate">{{ entry.label }}</span>
        </mat-checkbox>
      </div>
    }
  </div>

  <p class="text-xs opacity-60 mt-2">
    {{ t().export.selected(selectedCount(), entries().length) }}
  </p>
</div>

<div mat-dialog-actions align="end">
  <button type="button" mat-button (click)="cancel()">{{ t().export.cancel }}</button>
  <button
    type="button"
    mat-flat-button
    color="primary"
    [disabled]="selectedCount() === 0"
    (click)="confirm()"
  >
    {{ t().export.confirm }}
  </button>
</div>
