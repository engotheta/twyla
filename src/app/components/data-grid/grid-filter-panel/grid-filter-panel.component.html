<div class="w-80 max-h-[32rem] overflow-y-auto p-3">
  <app-generic-form [params]="formParams()" (instanceChange)="onFormInstance($event)" />

  <div class="flex justify-end gap-2 mt-2">
    @if (showClear()) {
      <button type="button" mat-button (click)="clear()">{{ clearLabel() }}</button>
    }
    @if (!isLive()) {
      <button type="button" mat-flat-button color="primary" (click)="apply()">{{ applyLabel() }}</button>
    }
  </div>
</div>
