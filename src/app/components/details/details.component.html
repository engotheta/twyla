@let p = effectiveParameter();

@if (loading()) {
  <mat-progress-bar mode="indeterminate" class="!h-0.5" [attr.aria-label]="t().loading" />
}

<div class="flex flex-col gap-4">
  @if (showHeader()) {
    <details-header
      [title]="p.header?.title"
      [titleClass]="p.header?.titleClass"
      [containerClass]="p.header?.class"
      [animation]="p.animation"
    />
  }

  @if (fieldGroups().length) {
    @if (p.showGroupsInTabs) {
      <tab-panels
        class="{{ p.groupConfig?.containerClass ?? '' }}"
        panelClass="pt-3"
        [tabs]="groupTabs()"
        [ariaLabel]="p.header?.title || t().sections"
        [classes]="tabsClasses()"
      >
        <ng-template let-index="index">
          <field-group
            [group]="fieldGroups()[index]"
            [layout]="p.layout ?? 'list'"
            [fieldConfig]="p.fieldConfig"
            [groupConfig]="p.groupConfig"
            [arrayConfig]="p.arrayConfig"
            [showBgIconMark]="p.showBgIconMark ?? false"
            [showGroupsInTabs]="p.showGroupsInTabs"
            [tabsClasses]="tabsClasses()"
            [asTab]="true"
            [data]="p.entity"
            [animation]="p.animation"
          />
        </ng-template>
      </tab-panels>
    } @else {
      <div class=" {{ 'flex flex-col gap-2' | mergeClasses: p.groupConfig?.containerClass ?? '' }}">
        @for (fg of fieldGroups(); track fg.slug ?? fg.label ?? $index) {
          <field-group
            [group]="fg"
            [layout]="p.layout ?? 'list'"
            [fieldConfig]="p.fieldConfig"
            [groupConfig]="p.groupConfig"
            [arrayConfig]="p.arrayConfig"
            [showBgIconMark]="p.showBgIconMark ?? false"
            [showGroupsInTabs]="p.showGroupsInTabs ?? false"
            [tabsClasses]="tabsClasses()"
            [data]="p.entity"
            [animation]="p.animation"
          />
        }
      </div>
    }
  }
</div>
