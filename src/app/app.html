<main class="flex min-h-screen flex-col items-center gap-6 bg-gray-200 p-8">
  <!-- <action-buttons [buttons]="buttons" [data]="data" /> -->
  <p class="text-sm text-gray-700">Last action: {{ log() }}</p>

  <!-- <div class="w-full max-w-5xl rounded-lg bg-white p-4 shadow">
    <all-details [parameter]="detailsParameter" />
  </div> -->
  <!--
  <div class="w-full max-w-4xl rounded-lg bg-white p-4 shadow">
    <generic-form [params]="speakerFormParams" />
  </div> -->

  <div class="w-full max-w-5xl rounded-lg bg-white p-4 shadow">
    <data-grid [parameter]="gridPar" />
  </div>

  <div class="w-full max-w-5xl rounded-lg bg-white p-4 shadow" style="height: 600px">
    <contents-view [parameter]="contentsViewParameter" />
  </div>

  @if (formResult(); as result) {
    <div class="w-full max-w-4xl rounded-lg bg-gray-900 p-4 text-xs text-green-400 shadow">
      <p class="mb-2 font-semibold text-white">
        {{
          result.mode === 'submitted'
            ? 'Submitted payload:'
            : 'Preview (current, unsubmitted) value:'
        }}
      </p>
      <pre class="overflow-x-auto whitespace-pre-wrap">{{ result.value | json }}</pre>
    </div>
  }
</main>

<ng-template #cellTemplate let-row>
  <action-buttons
    [buttons]="[
      {
        label: 'View',
        icon: 'visibility',
        click: (row_) =>
          log.set(`View clicked for row with id: ${row_?.id}` + ` and name: ${row_.salary}`),
      },
    ]"
    [data]="row"
  />
</ng-template>

<router-outlet />
